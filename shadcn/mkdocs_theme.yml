icon: null
show_title: true
hide_source_files: false
show_stargazers: true
pygments_style:
  light: shadcn-light
  dark: github-dark
topbar_sections: false
katex_options: null
show_datetime: false
accent: null

# Mewbo brand-fork additions ─────────────────────────────────────────────────

# Ask AI panel (DeepWiki backend). Set deepwiki_repo to enable. Setting to
# null (default) hides the entire Ask AI UI: the header CTA, the modal tab,
# the floating action button, the search-result handoff row, and the script
# tags themselves.
ai:
  # GitHub repo (owner/name) to use as DeepWiki context for Ask AI. Setting
  # this is the on/off switch for the entire Ask AI feature.
  deepwiki_repo: null

  # Prefix prepended to EVERY question sent to DeepWiki. Use this to:
  #   - Disambiguate product names with internal aliases / codenames
  #     (e.g. "AppX and its internal codename refer to the same product.")
  #   - Set tone or scope of answers ("Give product-first, well-grounded
  #     answers." / "Cite source files when possible.")
  # The default fallback (when this is null) is a single generic line:
  #     "Give product-first, well-grounded answers.\n\n"
  # so the prefix never silently leaks another product's aliases. Set this
  # explicitly per consumer.
  #
  # Example:
  #   theme:
  #     ai:
  #       deepwiki_repo: your-org/your-repo
  #       question_prefix: |
  #         I'm a new user; give product-first, well-grounded answers.
  #         AppX and its internal codename refer to the same product.
  question_prefix: null

  # Example questions surfaced in the Ask AI welcome state. Falls back to a
  # Mewbo-flavoured default list if empty/unset.
  examples: []

# Map sidebar nav-titles to Iconify slugs. Titles must match `nav:` labels
# exactly. Pages whose titles aren't in this map render with no icon.
# Example:
#   nav_icons:
#     Home: lucide:house
#     Get Started: lucide:rocket
nav_icons: {}

# Subpath prefix for version-switching when docs are served from a
# subdirectory (e.g. /your-docs on GitHub Pages). Leave null when serving
# from the domain root.
versions_root: null

# Brand footer (replaces the upstream "shadcn provided by @asiffer" line).
# All sub-keys are optional; the footer auto-derives sensible defaults
# from `nav`, `repo_url`, `site_description`, and `site_name`.
footer:
  # Tagline shown under the brand mark. Defaults to `site_description`.
  tagline: null

  # Shortlist for the auto-derived "Documentation" column: a list of
  # top-level `nav:` titles to keep, in nav order. Empty = every top-level
  # nav item. Links still resolve from `nav`, so no URLs are duplicated.
  # Example:
  #   theme.footer.docs: ["Get Started", "Terminal", "API"]
  docs: []

  # Per-product custom columns. Each section is rendered as its own column
  # of links. Example:
  #   theme.footer.sections:
  #     - title: Community
  #       links:
  #         - { title: Discord, url: "https://discord.gg/mewbo" }
  #         - { title: Blog,    url: "https://blog.mewbo.com" }
  sections: []

  # Social-icon row inside the brand cluster. Friendly platform names
  # (github, x, twitter, discord, linkedin, youtube, mastodon, bluesky,
  # instagram, facebook, rss, email, website) auto-resolve to the right
  # Iconify slug; any other key is treated as a literal Iconify slug.
  # The `github` entry is auto-filled from `repo_url` if not set.
  # Example:
  #   theme.footer.social:
  #     github:  https://github.com/mewbo-com/mkdocs-shadcn
  #     x:       https://x.com/mewbo
  #     discord: https://discord.gg/mewbo
  social: {}

  # Copyright line in the baseline strip. Defaults to "© <year> <site_name>"
  # where <year> is computed at build time via the `current_year` Jinja global.
  copyright: null

  # Small "Built with mkdocs-shadcn-mewbo" attribution link in the baseline
  # strip. Set to false to remove it (the LICENSE file's attribution still
  # satisfies the upstream MIT obligation).
  show_attribution: true

# Header dropdown that switches between mike-published versions. Requires
# `extra.version.provider: mike` on the consumer side AND a versions.json
# at the deployment root. Default off — without those artifacts, the
# script logs a 404 on every page load.
show_version_switcher: false

# Footer "build <commit>" badge that fetches a build-info.json artifact
# (commit/branch/timestamp) produced by your CI. Default off — without
# that artifact, the script logs a 404 on every page load.
show_build_info: false

# Image carousel support. When true, the theme loads Swiper (from CDN) plus its
# init script (js/carousel.js) on every page; a page opts in by writing
# `.swiper.ms-shots` markup. Default off so the CDN + script aren't fetched on
# sites that have no carousel. Styling lives in css/mewbo.css (.ms-shots).
carousel: false

# Full-screen image viewer. When true, the theme loads GLightbox (MIT, ~11KB
# gzipped, no dependencies, from CDN) plus js/lightbox.js, and every content
# image large enough to be a picture opens full screen on click. Inside a
# carousel the whole strip becomes one gallery, so the arrows walk it.
# Zoom is deliberately off: the ask is to SEE the image, not to inspect it.
# Opt a single image out with `.no-lightbox` or `data-lightbox="false"`.
# Off by default, so a site pays for nothing it does not use.
lightbox: false

# Sortable tables. When true the theme loads Tablesort (MIT, from CDN) plus
# js/sortable-tables.js, and every prose table with a header and more than one
# body row becomes click-to-sort. Off by default so a site that does not want
# it pays for neither the request nor the behaviour. Opt one table out with
# `data-no-sort`. Pygments' line-number tables are excluded structurally.
sortable_tables: false

# Horizontal tab rail fused to the bottom of the sticky header (second row on
# the same surface, hairline divider above it). Null/absent (default) emits
# zero markup. Each item: a label, an optional Iconify slug, and a
# site-root-relative url ("." or "" means the docs root). The tab whose url
# prefixes the current page.url is marked active (accent color + underline +
# aria-current="page"); if none match, the root tab is. Absolute http(s)
# urls are left untouched. Styling lives in css/mewbo.css (.ms-header-tabs).
#
# Two optional per-item keys refine the rail:
#   section: <exact top-level nav Section title> — scopes the LEFT sidebar to
#     this tab. On any page inside the named Section the sidebar shows ONLY
#     that Section's children; on every other (root-tab) page it shows the
#     full nav minus every claimed Section. Active whenever at least one tab
#     declares it; when set it wins over topbar_sections.
#   match: [<url-prefix>, ...] — extra site-root-relative prefixes that also
#     activate this tab (same normalization as url). Use it when one tab
#     fronts several top-level url trees. First-match-wins across tabs and the
#     root fallback are unchanged.
# Example:
#   theme:
#     header_tabs:
#       - label: Documentation
#         icon: lucide:book-open     # optional, any iconify name the theme already supports
#         url: .                      # site-root-relative; "." or "" means the docs root
#       - label: API Reference
#         icon: lucide:braces
#         url: rest-api/
#         section: API Reference      # sidebar shows only this Section on its pages
#         match:                       # these prefixes also light up this tab
#           - reference/
header_tabs: null

# Code-reference badges. Authors write markdown links with two custom URI
# schemes and the theme renders them as inline two-cell pills (styling in
# css/code-refs.css, loaded only when this is set):
#   [`app/main.py`](repo:app/main.py#L12-L20)   → octicon file badge, deep-linked
#                                                  to the repo at the build commit
#   [POST /api/x](endpoint:POST /api/x)          → method-tinted endpoint badge
# Null/absent (default) disables the feature entirely (no CSS, no rewriting).
# Set to an empty mapping (`code_refs: {}`) to enable file badges using
# `repo_url`. Endpoint badges stay off until you configure `endpoint` below.
# Example:
#   theme:
#     code_refs:
#       # File badges link to "<repo_url>/blob/<sha>/...". Override the base
#       # only if repo_url isn't a blob-style host (GitHub/Gitea/GitLab are).
#       repo_blob_url: null
#       # Ref used when the build commit SHA can't be resolved from git.
#       default_ref: main
#       # Endpoint badges — omit this whole block to leave endpoint: links be.
#       endpoint:
#         reference_page: rest-api/   # site-root-relative API reference page
#         tags:                       # path-prefix → tag (first match wins)
#           /api/sessions: Sessions
code_refs: null

# From upstream: ships a 404 page as a static template.
static_templates:
  - 404.html

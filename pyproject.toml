[project]
name = "mkdocs-shadcn-mewbo"
# Mewbo scheme; 1.2.x consolidates consumer brand divergences into the theme
# (site_name-driven identity, alternate_style tabs, carousel feature, ms-shot/
# ms-devices primitives, compact sidebar, table first-column fix). 1.2.1 tunes
# the sidebar spacing/typography.
version = "1.12.4"
description = "Mewbo's brand-fork of mkdocs-shadcn — same theme entrypoint, plus Ask AI panel, three-zone header, sidebar nav-icons, prefetch speculation, full SEO, and the cream/clay Mewbo palette as default."
authors = [
    { name = "mewbo-com" },
]
maintainers = [
    { name = "mewbo-com" },
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mkdocs>=1.6.1",
    "bottle>=0.13.2",
    "pymdown-extensions>=10.14.3",
    # Declared because the theme CONFIGURES `use_pygments: true` and ships
    # per-style Pygments stylesheets. Without it a consumer's code blocks
    # silently lose highlighting, fence titles and line numbers — pymdownx
    # degrades rather than erroring, so nothing points at the missing package.
    "pygments>=2.18.0",
    "gitpython>=3.1.45",
]

[project.urls]
Homepage = "https://github.com/mewbo-com/mkdocs-shadcn"
Repository = "https://github.com/mewbo-com/mkdocs-shadcn"
Issues = "https://github.com/mewbo-com/mkdocs-shadcn/issues"
Upstream = "https://github.com/asiffer/mkdocs-shadcn"

[dependency-groups]
dev = [
    "accessible-pygments>=0.0.4",
    "babel>=2.18.0",
    "beautifulsoup4>=4.14.3",
    "mike>=2.2.0",
    "mkdocstrings[python]>=0.26.1",
    "mypy>=1.12.0",
    "pre-commit>=3.5.0; python_version >= '3.9'",
    "properdocs>=1.6.7; python_version >= '3.9'",
    "pygithub>=2.9.1; python_version >= '3.9'",
    "pygments>=2.19.1",
    "pymdown-extensions>=10.14.2",
    "pytest-playwright>=0.5.2; python_version >= '3.9'",
    "rich>=14.3.4",
    "ruff>=0.12.11",
    "ty>=0.0.1a21",
    "typer>=0.20.1",
    "types-markdown>=3.7.0.20241204",
    "types-pygments>=2.19.0.20250107",
]

[project.optional-dependencies]
properdocs = ["properdocs >= 1.6.7; python_version >= '3.9'"]

[project.entry-points."mkdocs.themes"]
shadcn = "shadcn"

[project.entry-points."mkdocs.plugins"]
"shadcn/search" = "shadcn.plugins.search:SearchPlugin"
"shadcn/excalidraw" = "shadcn.plugins.excalidraw:ExcalidrawPlugin"
"shadcn/autonumber" = "shadcn.plugins.autonumber:AutoNumberPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shadcn"]


[tool.pytest]
log_cli = true
log_cli_level = "INFO"
